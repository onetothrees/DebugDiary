name: Generate GitBlog README

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate new md
        run: |
          python main.py ${{ secrets.G_T }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          # 验证文件是否生成
          if [ ! -f *.md ] && [ ! -f BACKUP/*.md ]; then
            echo "ERROR: No .md files generated!"
            exit 1
          fi

      - name: Push README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 添加主目录下的.md文件
          git add *.md || echo "No .md files found in root directory"
          git commit -a -m 'update new blog' || echo "nothing to commit"
          git push || echo "nothing to push"
